name: Deploy 字習工坊 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
      - name: Prepare website files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets
          cp index.html public/index.html
          cp assets/BpmfZihiKaiStd-Regular.ttf public/assets/
          test -s public/index.html
          test -s public/assets/BpmfZihiKaiStd-Regular.ttf
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
